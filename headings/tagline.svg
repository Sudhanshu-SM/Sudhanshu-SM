<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 55" width="700" height="55" role="img" aria-label="I ship products, not prototypes. AI, edtech, agents, games. Four live, building the next.">
  <style>
    :root { --accent:#0F766E; }
    @media (prefers-color-scheme: dark) { :root { --accent:#2DD4BF; } }
    .l { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
         font-size: 22px; font-weight: 600; fill: var(--accent); }
  </style>
  <text class="l" x="350" y="30" text-anchor="middle" dominant-baseline="middle" opacity="0">I ship products, not prototypes.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.31;0.35;1" dur="12s" begin="0s" repeatCount="indefinite"/></text>
  <text class="l" x="350" y="30" text-anchor="middle" dominant-baseline="middle" opacity="0">AI · edtech · agents · games<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.31;0.35;1" dur="12s" begin="4s" repeatCount="indefinite"/></text>
  <text class="l" x="350" y="30" text-anchor="middle" dominant-baseline="middle" opacity="0">Four live. Building the next.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.31;0.35;1" dur="12s" begin="8s" repeatCount="indefinite"/></text>
</svg>
