<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" role="img" aria-label="">
  <style>:root{--a:#0F766E}@media(prefers-color-scheme:dark){:root{--a:#2DD4BF}}</style>
  <circle cx="8" cy="8" r="4" fill="var(--a)"/>
